name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: Smoke backtest (offline sample panel)
        run: |
          python -m aetf_momentum.app.cli backtest run \
            --factor-preset daily_momentum \
            --panel examples/sample_panel.csv \
            --output artifacts/smoke
