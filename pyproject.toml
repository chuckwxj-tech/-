[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aetf-momentum"
version = "0.1.0"
description = "A-share ETF momentum research framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.16",
  "numpy>=1.26",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=16",
  "pydantic>=2.8",
  "scipy>=1.13",
  "typer>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
aetf = "aetf_momentum.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aetf_momentum"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
